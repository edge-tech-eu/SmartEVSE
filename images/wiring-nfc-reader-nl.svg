<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">Aansluiten van de NFC-kaartlezer EVSE-X-NFC</title><desc id="d">De NFC-kaartlezer EVSE-X-NFC heeft een 4-polige klem: + en − krijgen 12 V DC (12 tot 24 V, ongeveer 40 mA) van een voeding in de laadpaal; A en B gaan naar A+ en B− van de Modbuslijn bij de laadmodule, en − is gemeenschappelijk met G van die lijn. In plaats van 12 V kan 5 V DC op de 5V-pin van de pinheader, niet allebei. De Modbuslijn loopt verder naar de wifi-module en de volgende laadpaal. De lezer antwoordt op Modbusadres 50, met dezelfde baudrate als de bus.</desc>
<rect width="1000" height="560" fill="#fbfaf6"/>
<rect x="80" y="150" width="300" height="230" rx="6" fill="#e6efe9" stroke="#1f6f50" stroke-width="1.8"/>
<text x="200" y="250" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f6f50" text-anchor="middle">EVSE-X-NFC</text>
<text x="200" y="268" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6f50" text-anchor="middle">NFC-kaartlezer</text>
<text x="200" y="300" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">vlakke antennezijde</text>
<text x="200" y="314" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">tegen het deksel</text>
<text x="370" y="172" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6b675e" text-anchor="end">4-polige klem</text>
<rect x="373" y="188" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="199" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">+</text>
<rect x="373" y="218" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="229" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">A</text>
<rect x="373" y="248" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="259" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">B</text>
<rect x="373" y="278" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="289" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">−</text>
<rect x="373" y="338" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="349" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">5V-pin</text>
<text x="370" y="368" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b675e" text-anchor="end">pinheader</text>
<rect x="700" y="50" width="200" height="90" rx="8" fill="#efece4" stroke="#141414" stroke-width="1.5"/>
<text x="800" y="80" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">12 V DC-voeding</text>
<text x="800" y="98" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle">12–24 V, ongeveer 40 mA</text>
<rect x="693" y="105" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
