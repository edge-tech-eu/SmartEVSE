<path d="M387,285 L560,285 L560,128 L693,128" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="560" cy="285" r="3.5" fill="#141414"/>
<rect x="700" y="195" width="200" height="120" rx="8" fill="#efece4" stroke="#141414" stroke-width="1.5"/>
<text x="800" y="290" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">Laadmodule</text>
<text x="800" y="306" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">EVSE-C-3x32A</text>
<rect x="693" y="218" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="229" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">A+</text>
<rect x="693" y="248" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="259" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">B−</text>
<rect x="693" y="278" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="289" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">G</text>
<path d="M387,225 L693,225" fill="none" stroke="#6a3fa0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M387,255 L693,255" fill="none" stroke="#6a3fa0" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="8 5"/>
<path d="M560,285 L693,285" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M800,315 L800,345 L980,345" fill="none" stroke="#6a3fa0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="812" y="372" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6a3fa0" text-anchor="start">Modbus RS485 verder naar de</text>
<text x="812" y="386" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6a3fa0" text-anchor="start">wifi-module en de volgende laadpaal</text>
<rect x="700" y="420" width="200" height="80" rx="8" fill="#fbfaf6" stroke="#6b675e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="800" y="450" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b675e" text-anchor="middle">of: 5 V DC-voeding</text>
<text x="800" y="468" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">in plaats van 12 V, niet allebei</text>
<rect x="693" y="475" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="486" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">+</text>
<path d="M387,345 L480,345 L480,482 L693,482" fill="none" stroke="#c62828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
<text x="80" y="420" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">− (GND) is gemeenschappelijk: de voeding, de</text>
<text x="80" y="435" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">lezer en G van de Modbuslijn.</text>
<text x="80" y="460" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">Lezer op Modbusadres 50, met dezelfde</text>
<text x="80" y="475" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">baudrate als de bus (in te stellen via USB).</text>
<path d="M80,520 L108,520" fill="none" stroke="#c62828" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="524" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">+12 V (of +5 V, gestippeld)</text>
