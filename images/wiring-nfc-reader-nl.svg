<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t d">
<title id="t">Aansluiten van de NFC-kaartlezer EVSE-X-NFC</title><desc id="d">De Modbuslijn loopt als één lijn van apparaat naar apparaat: van de wifi-module naar de laadmodule, van daar naar de NFC-kaartlezer EVSE-X-NFC en verder naar de volgende laadpaal, met de kabel erin en de kabel eruit op dezelfde klemmen (A, B en G), zonder aftakkingen. De lezer heeft een 4-polige klem: A en B op de Modbuslijn, − op G en op de − van een 12 V DC-voeding in de laadpaal (12 tot 24 V, ongeveer 40 mA), + op de + van die voeding. In plaats van 12 V kan 5 V DC op de 5V-pin van de pinheader, niet allebei. De lezer antwoordt op Modbusadres 50, met dezelfde baudrate als de bus.</desc>
