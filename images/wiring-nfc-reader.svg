<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t d">
<title id="t">Wiring the NFC card reader EVSE-X-NFC</title><desc id="d">The Modbus line runs as one line from device to device: from the site controller to the charge controller, from there to the NFC card reader EVSE-X-NFC, and on to the next charger, with the cable in and the cable out on the same terminals (A, B and G), no branches. The reader has a 4-pole terminal: A and B on the Modbus line, − on G and on the − of a 12 V DC supply in the charger box (12 to 24 V, about 40 mA), + on the + of that supply. Instead of 12 V, 5 V DC can be fed on the 5 V header pin, not both. The reader answers at Modbus address 50, at the same baud rate as the bus.</desc>
