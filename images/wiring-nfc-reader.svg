<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">Wiring the NFC card reader EVSE-X-NFC</title><desc id="d">The NFC card reader EVSE-X-NFC has a 4-pole terminal: + and − take 12 V DC (12 to 24 V, about 40 mA) from a supply in the charger box; A and B go to A+ and B− of the Modbus line at the charge controller, and − is shared with G of that line. Instead of 12 V, 5 V DC can be fed on the 5 V header pin, not both. The Modbus line continues to the site controller and the next charger. The reader answers at Modbus address 50, at the same baud rate as the bus.</desc>
<rect width="1000" height="560" fill="#fbfaf6"/>
<rect x="80" y="150" width="300" height="230" rx="6" fill="#e6efe9" stroke="#1f6f50" stroke-width="1.8"/>
<text x="200" y="250" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f6f50" text-anchor="middle">EVSE-X-NFC</text>
<text x="200" y="268" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6f50" text-anchor="middle">NFC card reader</text>
<text x="200" y="300" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">flat antenna side</text>
<text x="200" y="314" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">against the lid</text>
<text x="370" y="172" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6b675e" text-anchor="end">4-pole terminal</text>
<rect x="373" y="188" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="199" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">+</text>
<rect x="373" y="218" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="229" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">A</text>
<rect x="373" y="248" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="259" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">B</text>
<rect x="373" y="278" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="289" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">−</text>
<rect x="373" y="338" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="368" y="349" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="end">5V pin</text>
<text x="370" y="368" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b675e" text-anchor="end">header</text>
<rect x="700" y="50" width="200" height="90" rx="8" fill="#efece4" stroke="#141414" stroke-width="1.5"/>
<text x="800" y="80" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">12 V DC supply</text>
<text x="800" y="98" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle">12–24 V, about 40 mA</text>
<rect x="693" y="105" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="116" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">+</text>
<rect x="693" y="121" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="132" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">−</text>
<path d="M387,195 L520,195 L520,112 L693,112" fill="none" stroke="#c62828" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M387,285 L560,285 L560,128 L693,128" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="560" cy="285" r="3.5" fill="#141414"/>
<rect x="700" y="195" width="200" height="120" rx="8" fill="#efece4" stroke="#141414" stroke-width="1.5"/>
<text x="800" y="290" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">Charge controller</text>
<text x="800" y="306" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">EVSE-C-3x32A</text>
<rect x="693" y="218" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="229" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">A+</text>
<rect x="693" y="248" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="259" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">B−</text>
<rect x="693" y="278" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="289" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">G</text>
<path d="M387,225 L693,225" fill="none" stroke="#6a3fa0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M387,255 L693,255" fill="none" stroke="#6a3fa0" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="8 5"/>
<path d="M560,285 L693,285" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M800,315 L800,345 L980,345" fill="none" stroke="#6a3fa0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="812" y="372" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6a3fa0" text-anchor="start">Modbus RS485 on to the site</text>
<text x="812" y="386" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6a3fa0" text-anchor="start">controller and the next charger</text>
<rect x="700" y="420" width="200" height="80" rx="8" fill="#fbfaf6" stroke="#6b675e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="800" y="450" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b675e" text-anchor="middle">or: 5 V DC supply</text>
<text x="800" y="468" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">instead of 12 V, not both</text>
<rect x="693" y="475" width="14" height="14" rx="2" fill="#f7f3e3" stroke="#141414" stroke-width="1.2"/>
<text x="712" y="486" font-family="'Archivo Narrow', 'Arial Narrow', Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#141414" text-anchor="start">+</text>
<path d="M387,345 L480,345 L480,482 L693,482" fill="none" stroke="#c62828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
<text x="80" y="420" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">− (GND) is shared: the supply, the reader</text>
<text x="80" y="435" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">and G of the Modbus line.</text>
<text x="80" y="460" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">Reader at Modbus address 50, at the same</text>
<text x="80" y="475" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">baud rate as the bus (set over USB).</text>
<path d="M80,520 L108,520" fill="none" stroke="#c62828" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="524" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">+12 V (or +5 V, dotted)</text>
<path d="M290,520 L318,520" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="326" y="524" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">− / GND</text>
<path d="M400,520 L428,520" fill="none" stroke="#6a3fa0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="436" y="524" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">A</text>
<path d="M470,520 L498,520" fill="none" stroke="#6a3fa0" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text x="506" y="524" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="start">B</text>
</svg>
