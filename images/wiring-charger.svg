<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">Wiring the charge controller EVSE-C-3x32A</title><desc id="d">The power cable (L1, L2, L3, N, PE) runs from a charger group with a Type A RCD and a 3-pole + N breaker to POWER IN on the charge controller. POWER OUT (L1, L2, L3, N) runs through the ring of the DC-leakage sensor into the charge cable with the Type 2 plug; PE goes straight to the charge cable, the control pilot from the CP terminal. The Modbus cable (G, A+, B−) runs to the site controller and on to the next charger.</desc>
