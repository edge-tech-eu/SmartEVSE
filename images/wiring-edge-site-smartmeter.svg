<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">Installing the Edge Smart Load Balancer EVSE-SC-02 on the P1 port of the smart meter</title><desc id="d">The Edge Smart Load Balancer EVSE-SC-02 sits next to the DSMR 5 smart meter, not in the consumer unit, and is connected to the P1 port with an RJ12 cable that also powers it. There are no CT clamps. One Modbus cable runs from the load balancer past every charger. It connects over 2.4 GHz WiFi to the home router and through the internet to the EdgeTech platform; the MyCharger app controls the chargers.</desc>
