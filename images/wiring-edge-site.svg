<title id="t">Installing the Edge Load Balancer EVSE-SC-01 with three CT clamps</title><desc id="d">The Edge Load Balancer EVSE-SC-01 sits on the DIN rail in the metering cabinet, powered with 230 V via a fuse. Three CT clamps go around L1, L2 and L3 between the meter and the main switch, arrow towards the load, with their leads to inputs C1 to C3. One Modbus cable runs from the load balancer past every charger. The load balancer connects over 2.4 GHz WiFi to the home router and through the internet to the EdgeTech platform; the MyCharger app controls the chargers.</desc>
